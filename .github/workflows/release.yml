name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Vet
        run: go vet ./...
      - name: Build check
        run: go build ./...
      - name: Test
        run: go test ./...

  release:
    needs: ci-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" -o kas-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: kas-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -s -w '\n%{http_code}' -X POST ${{ secrets.URL_DEPLOY }} \
            -H "Authorization: Bearer ${{ secrets.TOKEN_DEPLOY }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${{ github.ref_name }}\"}"
