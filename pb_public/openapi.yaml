openapi: 3.0.3
info:
  title: Uang Kas Keluarga API
  description: API for managing family finances, including transactions and reports.
  version: 1.0.0
servers:
  - url: /
    description: Current server
paths:
  /api/transactions:
    get:
      summary: List authenticated family transactions
      description: Retrieve paginated transactions for the authenticated user's family within an inclusive date range. The family_id is derived from the bearer token and any family_id query value is ignored.
      security:
        - bearerAuth: []
      parameters:
        - name: start
          in: query
          required: true
          description: Inclusive start date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
            example: '2026-05-01'
        - name: end
          in: query
          required: true
          description: Inclusive end date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
            example: '2026-05-31'
        - name: page
          in: query
          description: Page number. Defaults to 1 when omitted or invalid.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: perPage
          in: query
          description: Items per page. Defaults to 20 when omitted or outside 1-100.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
              example:
                items:
                  - id: tx123
                    family_id: fam123
                    created_by: user123
                    category_id: cat123
                    type: expense
                    amount: 50000
                    note: Belanja bulanan
                    date: '2026-05-10T10:00:00Z'
                    created_at: '2026-05-10T10:00:00Z'
                    updated_at: '2026-05-10T10:00:00Z'
                    category:
                      id: cat123
                      name: Makanan
                      icon: 🍔
                      color: '#FF5733'
                      is_default: false
                    creator:
                      id: user123
                      name: Budi
                    family:
                      id: fam123
                      name: Keluarga Bahagia
                page: 1
                perPage: 20
                totalItems: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create new transaction
      description: Create a new income or expense transaction for a family.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/transactions/{id}:
    get:
      summary: Get transaction by ID
      description: Retrieve details of a specific transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update transaction
      description: Update an existing transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete transaction
      description: Remove a transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/families/{familyId}/transactions:
    get:
      summary: Get family transactions
      description: Retrieve paginated transactions for a specific family.
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionDTO'
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/families/{familyId}/balance:
    get:
      summary: Get family balance
      description: Retrieve the current total balance for a family.
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  family_id:
                    type: string
                  balance:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/reports/monthly:
    get:
      summary: Get monthly report
      description: Retrieve financial report for a specific month, including total income, total expense, balance, and per-category breakdowns for both income and expenses.
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReportDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/reports/summary:
    get:
      summary: Get dashboard summary
      description: Retrieve high-level financial summary for the dashboard.
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TransactionDTO:
      type: object
      properties:
        id:
          type: string
        family_id:
          type: string
        created_by:
          type: string
        category_id:
          type: string
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
        note:
          type: string
        date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        family:
          $ref: '#/components/schemas/FamilyExpand'
        category:
          $ref: '#/components/schemas/CategoryExpand'
        creator:
          $ref: '#/components/schemas/UserExpand'

    CreateTransactionRequest:
      type: object
      required:
        - category_id
        - type
        - amount
        - date
      properties:
        category_id:
          type: string
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
          minimum: 0.01
        note:
          type: string
        date:
          type: string
          format: date-time
          description: ISO date format string

    UpdateTransactionRequest:
      type: object
      properties:
        category_id:
          type: string
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
        note:
          type: string
        date:
          type: string
          format: date-time

    TransactionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDTO'
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3

    MonthlyReportDTO:
      type: object
      properties:
        family_id:
          type: string
        year:
          type: integer
        month:
          type: integer
        total_income:
          type: number
        total_expense:
          type: number
        balance:
          type: number
        expense_breakdown:
          type: array
          description: Per-category breakdown for expenses
          items:
            $ref: '#/components/schemas/CategoryBreakdownDTO'
        income_breakdown:
          type: array
          description: Per-category breakdown for income
          items:
            $ref: '#/components/schemas/CategoryBreakdownDTO'

    DashboardSummaryDTO:
      type: object
      properties:
        family_name:
          type: string
        user_name:
          type: string
        total_balance:
          type: number
        monthly_income:
          type: number
        monthly_income_change:
          type: number
        monthly_expense:
          type: number
        monthly_expense_change:
          type: number

    CategoryBreakdownDTO:
      type: object
      properties:
        category_id:
          type: string
        category_name:
          type: string
        icon:
          type: string
        color:
          type: string
        total_amount:
          type: number
        count:
          type: integer

    FamilyExpand:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        invite_code:
          type: string

    CategoryExpand:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        is_default:
          type: boolean

    UserExpand:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatar:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
