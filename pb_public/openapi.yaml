  /webhooks/digiflazz/{token}:
    post:
      consumes:
      - application/json
      description: Receives and processes Digiflazz webhook notifications. The token
        identifies the family credential. Signature is validated via HMAC-SHA1 over
        the raw body.
      parameters:
      - description: Webhook token (identifies the Digiflazz credential)
        in: path
        name: token
        required: true
        type: string
      - description: 'HMAC-SHA1 signature (format: sha1=<hex>)'
        in: header
        name: X-Hub-Signature
        type: string
      - description: Digiflazz event type
        in: header
        name: X-Digiflazz-Event
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Webhook received
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - invalid signature
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found - invalid token
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Receive Digiflazz webhook
      tags:
      - digiflazz-webhook
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
