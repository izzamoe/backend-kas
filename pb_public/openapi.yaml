basePath: /
definitions:
  digiflazz.BalanceResponse:
    properties:
      balance:
        type: number
      family_id:
        type: string
    type: object
  digiflazz.CreateCredentialRequest:
    properties:
      api_key:
        type: string
      family_id:
        type: string
      testing:
        type: boolean
      username:
        type: string
      webhook_secret:
        type: string
    type: object
  digiflazz.CreateOrderRequest:
    properties:
      amount:
        type: number
      credential_id:
        type: string
      customer_id2:
        type: string
      customer_name:
        type: string
      customer_no:
        type: string
      event_type:
        $ref: '#/definitions/digiflazz.EventType'
      family_id:
        type: string
      note:
        type: string
      order_type:
        enum:
        - prepaid
        - postpaid
        type: string
      product_code:
        type: string
      ref_id:
        type: string
      year:
        type: integer
    type: object
  digiflazz.CredentialDTO:
    properties:
      api_key_last4:
        type: string
      balance:
        type: number
      created_at:
        type: string
      family_id:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      testing:
        type: boolean
      updated_at:
        type: string
      username:
        type: string
      webhook_configured:
        type: boolean
    type: object
  digiflazz.DigiflazzDepositResponse:
    properties:
      account_no:
        type: string
      amount:
        type: number
      bank:
        type: string
      notes:
        type: string
      payment_method:
        type: string
      rc:
        type: string
    type: object
  digiflazz.EventType:
    enum:
    - topup
    - inquiry
    - pay
    - status
    - deposit
    - webhook
    - error
    type: string
    x-enum-varnames:
    - EventTypeTopup
    - EventTypeInquiry
    - EventTypePay
    - EventTypeStatus
    - EventTypeDeposit
    - EventTypeWebhook
    - EventTypeError
  digiflazz.OrderDTO:
    properties:
      admin:
        type: number
      buyer_last_saldo:
        type: number
      created_at:
        type: string
      created_by:
        type: string
      credential_id:
        type: string
      customer_name:
        type: string
      customer_no:
        type: string
      desc:
        type: string
      event_type:
        $ref: '#/definitions/digiflazz.EventType'
      family_id:
        type: string
      id:
        type: string
      message:
        type: string
      periode:
        type: string
      price:
        type: number
      processed_at:
        type: string
      product_brand:
        type: string
      product_category:
        type: string
      product_code:
        type: string
      product_name:
        type: string
      rc:
        type: string
      ref_id:
        type: string
      requested_at:
        type: string
      selling_price:
        type: number
      sn:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/digiflazz.OrderStatus'
        enum:
        - inquiry
        - pending
        - processing
        - success
        - failed
        - cancelled
      tele:
        type: string
      transaction_id:
        type: string
      updated_at:
        type: string
      wa:
        type: string
    type: object
  digiflazz.OrderListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/digiflazz.OrderDTO'
        type: array
      page:
        type: integer
      page_size:
        type: integer
    type: object
  digiflazz.OrderStatus:
    enum:
    - inquiry
    - pending
    - processing
    - success
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - OrderStatusInquiry
    - OrderStatusPending
    - OrderStatusProcessing
    - OrderStatusSuccess
    - OrderStatusFailed
    - OrderStatusCancelled
  digiflazz.ProductDTO:
    properties:
      admin:
        type: number
      brand:
        type: string
      category:
        type: string
      code:
        type: string
      commission:
        type: number
      description:
        type: string
      end_cut_off:
        type: string
      last_updated:
        type: string
      multi:
        type: boolean
      name:
        type: string
      price:
        type: number
      seller_name:
        type: string
      start_cut_off:
        type: string
      status:
        type: string
      stock:
        type: integer
      type:
        type: string
      unlimited_stock:
        type: boolean
    type: object
  digiflazz.ProductListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/digiflazz.ProductDTO'
        type: array
      limit:
        type: integer
    type: object
  digiflazz.RotateWebhookTokenResponse:
    properties:
      credential:
        $ref: '#/definitions/digiflazz.CredentialDTO'
      token:
        type: string
    type: object
  digiflazz.UpdateCredentialRequest:
    properties:
      api_key:
        type: string
      is_active:
        type: boolean
      testing:
        type: boolean
      username:
        type: string
      webhook_secret:
        type: string
    type: object
  domain.BalanceResponse:
    properties:
      balance:
        type: number
      family_id:
        type: string
    type: object
  domain.CategoryBreakdownDTO:
    description: CategoryBreakdownDTO represents a single category's financial breakdown
    properties:
      category_id:
        example: cat1
        type: string
      category_name:
        example: Makanan
        type: string
      color:
        example: '#FF5733'
        type: string
      count:
        description: Number of transactions
        example: 12
        type: integer
      icon:
        example: "\U0001F354"
        type: string
      total_amount:
        example: 800000
        type: number
    type: object
  domain.CategoryExpand:
    properties:
      color:
        type: string
      icon:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      name:
        type: string
    type: object
  domain.CreateFamilyRequest:
    properties:
      name:
        type: string
    type: object
  domain.CreateFamilyResponse:
    properties:
      family:
        $ref: '#/definitions/domain.FamilyDTO'
      member:
        $ref: '#/definitions/domain.FamilyMemberDTO'
    type: object
  domain.CreateTransactionRequest:
    properties:
      amount:
        type: number
      category_id:
        type: string
      date:
        description: ISO format
        type: string
      note:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.TransactionType'
        enum:
        - income
        - expense
    required:
    - amount
    - category_id
    - date
    - type
    type: object
  domain.DashboardSummaryDTO:
    description: DashboardSummaryDTO represents the dashboard summary response
    properties:
      family_name:
        example: Keluarga Bahagia
        type: string
      monthly_expense:
        description: This month's expense
        example: 1800000
        type: number
      monthly_expense_change:
        description: '% change from prev month'
        example: -5.2
        type: number
      monthly_income:
        description: This month's income
        example: 5000000
        type: number
      monthly_income_change:
        description: '% change from prev month'
        example: 10.5
        type: number
      total_balance:
        description: Overall balance
        example: 12000000
        type: number
      user_name:
        example: Budi
        type: string
    type: object
  domain.FamilyDTO:
    properties:
      created_at:
        type: string
      id:
        type: string
      invite_code:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.FamilyExpand:
    properties:
      id:
        type: string
      invite_code:
        type: string
      name:
        type: string
    type: object
  domain.FamilyMemberDTO:
    properties:
      created_at:
        type: string
      family_id:
        type: string
      id:
        type: string
      role:
        description: '@Enums owner, member'
        enum:
        - owner
        - member
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  domain.FamilyTransactionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.TransactionDTO'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
    type: object
  domain.JoinFamilyRequest:
    properties:
      invite_code:
        type: string
    type: object
  domain.MonthlyReportDTO:
    description: MonthlyReportDTO represents the monthly financial report response
    properties:
      balance:
        description: TotalIncome - TotalExpense
        example: 3200000
        type: number
      expense_breakdown:
        description: Breakdown per category for expenses
        items:
          $ref: '#/definitions/domain.CategoryBreakdownDTO'
        type: array
      family_id:
        example: abc123
        type: string
      income_breakdown:
        description: Breakdown per category for income
        items:
          $ref: '#/definitions/domain.CategoryBreakdownDTO'
        type: array
      month:
        example: 4
        type: integer
      total_expense:
        example: 1800000
        type: number
      total_income:
        example: 5000000
        type: number
      year:
        example: 2026
        type: integer
    type: object
  domain.TransactionDTO:
    properties:
      amount:
        type: number
      category:
        $ref: '#/definitions/domain.CategoryExpand'
      category_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      creator:
        $ref: '#/definitions/domain.UserExpand'
      date:
        type: string
      family:
        allOf:
        - $ref: '#/definitions/domain.FamilyExpand'
        description: Expanded fields (optional, populated when expand is used)
      family_id:
        type: string
      id:
        type: string
      note:
        type: string
      type:
        $ref: '#/definitions/domain.TransactionType'
      updated_at:
        type: string
    type: object
  domain.TransactionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.TransactionDTO'
        type: array
      page:
        type: integer
      perPage:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  domain.TransactionType:
    enum:
    - income
    - expense
    type: string
    x-enum-varnames:
    - TransactionTypeIncome
    - TransactionTypeExpense
  domain.UpdateTransactionRequest:
    properties:
      amount:
        type: number
      category_id:
        type: string
      date:
        type: string
      note:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.TransactionType'
        enum:
        - income
        - expense
    type: object
  domain.UserExpand:
    properties:
      avatar:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  handler.DepositRequest:
    properties:
      amount:
        type: number
      bank:
        type: string
    type: object
  service.SyncResult:
    properties:
      errors:
        items:
          type: string
        type: array
      postpaid_upserted:
        type: integer
      prepaid_upserted:
        type: integer
      total_upserted:
        type: integer
    type: object
info:
  contact: {}
  description: API for managing family finances, including transactions, reports,
    and Digiflazz integration.
  title: Uang Kas Keluarga API
  version: 1.0.0
paths:
  /api/digiflazz/credential:
    delete:
      description: Permanently removes the family's Digiflazz credential. Owner-only.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete Digiflazz credential
      tags:
      - digiflazz-credentials
    get:
      description: Returns credential metadata (no plaintext secrets) for the authenticated
        family. Owner-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.CredentialDTO'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Digiflazz credential
      tags:
      - digiflazz-credentials
    patch:
      consumes:
      - application/json
      description: Partially updates credential fields. Omit a field to leave it unchanged.
        Owner-only.
      parameters:
      - description: Fields to update — all optional
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/digiflazz.UpdateCredentialRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.CredentialDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update Digiflazz credential
      tags:
      - digiflazz-credentials
    post:
      consumes:
      - application/json
      description: Creates a new Digiflazz credential for the authenticated family.
        Owner-only. The family_id is always taken from the auth context and cannot
        be overridden via request body.
      parameters:
      - description: Credential fields — api_key is encrypted at rest; api_key_last4
          is shown in responses
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/digiflazz.CreateCredentialRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/digiflazz.CredentialDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create Digiflazz credential
      tags:
      - digiflazz-credentials
  /api/digiflazz/credential/balance:
    get:
      description: Fetches the current deposit balance from Digiflazz for the authenticated
        family. Owner-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.BalanceResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Digiflazz balance
      tags:
      - digiflazz-credentials
  /api/digiflazz/credential/rotate:
    post:
      description: Generates a new webhook token for the family's Digiflazz credential.
        The new token is returned once — store it securely. Owner-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.RotateWebhookTokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Rotate webhook token
      tags:
      - digiflazz-credentials
  /api/digiflazz/deposit:
    post:
      consumes:
      - application/json
      description: Initiates a deposit to the family's Digiflazz account. Returns
        bank transfer details. Owner-only.
      parameters:
      - description: Deposit amount and destination bank
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.DepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.DigiflazzDepositResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create deposit request
      tags:
      - digiflazz-credentials
  /api/digiflazz/orders:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of Digiflazz orders for the authenticated
        user's family.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size, 1-100 (default: 20)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.OrderListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List Digiflazz orders
      tags:
      - digiflazz-orders
    post:
      consumes:
      - application/json
      description: Creates a prepaid order or postpaid inquiry. Set order_type to
        "prepaid" (default) or "postpaid" for a postpaid inquiry.
      parameters:
      - description: Order request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/digiflazz.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/digiflazz.OrderDTO'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a Digiflazz order
      tags:
      - digiflazz-orders
  /api/digiflazz/orders/{id}:
    get:
      consumes:
      - application/json
      description: Returns a single Digiflazz order by ID for the authenticated user's
        family.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.OrderDTO'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a Digiflazz order
      tags:
      - digiflazz-orders
  /api/digiflazz/orders/{id}/check-status:
    post:
      consumes:
      - application/json
      description: Polls Digiflazz for the latest status of a postpaid order and updates
        it in the system.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.OrderDTO'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Check and update Digiflazz order status
      tags:
      - digiflazz-orders
  /api/digiflazz/orders/{id}/pay:
    post:
      consumes:
      - application/json
      description: Executes payment for an existing postpaid inquiry order.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.OrderDTO'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Pay a postpaid inquiry order
      tags:
      - digiflazz-orders
  /api/digiflazz/products:
    get:
      description: Returns a filtered list of available Digiflazz products. Accessible
        by all family members.
      parameters:
      - description: Free-text search on product name or SKU code
        in: query
        name: query
        type: string
      - description: Filter by product category (e.g. Pulsa, Data, PLN)
        in: query
        name: category
        type: string
      - description: Filter by brand (e.g. Telkomsel, XL)
        in: query
        name: brand
        type: string
      - description: Filter by order type
        enum:
        - prepaid
        - postpaid
        in: query
        name: type
        type: string
      - description: Filter by product status
        enum:
        - active
        - inactive
        in: query
        name: status
        type: string
      - description: Number of results to return (1–200, default 50)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/digiflazz.ProductListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
